# CI: run pre-push checks (fmt/clippy/C checks/public API/unit tests/integration suites)
# plus upstream SQLite validation, amalgamation build, Zed extension, UI tests, and
# Playwright e2e tests on every PR and push to main.
name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "web/docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/workflows/**"
      - "!.github/workflows/ci.yml"
      - "integrations/claude-code/**"
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pre-push:
    name: Pre-push checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache third_party
        uses: actions/cache@v5
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('python/tools/install_build_deps.py') }}

      - name: Install system dependencies (tcl/tcl-dev for upstream SQLite suite)
        run: sudo apt-get update && sudo apt-get install -y tcl tcl-dev

      - name: Install build dependencies
        run: python3 tools/install-build-deps

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache cargo-public-api binary and nightly toolchain
        id: cache-public-api
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-public-api
            ~/.rustup/toolchains/nightly-*
            ~/.rustup/update-hashes/nightly-*
          key: cargo-public-api-nightly-${{ runner.os }}-v1

      - name: Install nightly Rust toolchain (for cargo-public-api rustdoc JSON)
        if: steps.cache-public-api.outputs.cache-hit != 'true'
        run: rustup toolchain install nightly --profile minimal --no-self-update

      - name: Install cargo-public-api
        if: steps.cache-public-api.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-public-api

      - name: Run pre-push checks
        run: tools/pre-push --all -v
        env:
          CC: clang
          CXX: clang++

      - name: Run upstream SQLite validation tests
        run: tools/run-integration-tests --suite upstream-sqlite --validate

      - name: Upload CLI binary
        uses: actions/upload-artifact@v6
        with:
          name: syntaqlite-cli
          path: target/debug/syntaqlite
          retention-days: 1

  zed-extension:
    name: Zed extension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Add wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Build Zed extension
        run: cargo build --target wasm32-unknown-unknown --manifest-path integrations/zed/Cargo.toml

  amalgamation:
    name: Amalgamation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache third_party
        uses: actions/cache@v5
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('python/tools/install_build_deps.py') }}

      - name: Install build dependencies
        run: python3 tools/install-build-deps

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-amalg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-amalg-${{ runner.os }}-

      - name: Build amalgamation and compile examples
        run: tools/build-amalgamation

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache third_party (UI)
        uses: actions/cache@v5
        with:
          path: third_party
          key: third-party-ui-${{ runner.os }}-${{ hashFiles('python/tools/install_build_deps.py') }}

      - name: Install build dependencies (Node.js + Emscripten, no Rust)
        run: python3 tools/install-build-deps --no-rust --ui

      - name: Install syntaqlite dependencies
        working-directory: web/syntaqlite-js
        run: |
          export PATH="$PWD/../../third_party/bin/linux-amd64/nodejs/bin:$PATH"
          npm ci

      - name: Build syntaqlite
        working-directory: web/syntaqlite-js
        run: |
          export PATH="$PWD/../../third_party/bin/linux-amd64/nodejs/bin:$PATH"
          npm run build

      - name: Install playground dependencies
        working-directory: web/playground
        run: |
          export PATH="$PWD/../../third_party/bin/linux-amd64/nodejs/bin:$PATH"
          npm ci

      - name: Run UI tests
        working-directory: web/playground
        run: |
          export PATH="$PWD/../../third_party/bin/linux-amd64/nodejs/bin:$PATH"
          npm test

  playwright-tests:
    name: Playwright e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache third_party (UI + Rust)
        uses: actions/cache@v5
        with:
          path: third_party
          key: third-party-ui-rust-${{ runner.os }}-${{ hashFiles('python/tools/install_build_deps.py') }}

      - name: Install build dependencies (Rust + Node.js + Emscripten)
        run: python3 tools/install-build-deps --ui

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-playwright-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-playwright-${{ runner.os }}-

      - name: Build WASM modules
        run: python3 tools/build-web-playground --hermetic

      - name: Build syntaqlite
        working-directory: web/syntaqlite-js
        run: |
          export PATH="$PWD/../../third_party/bin/linux-amd64/nodejs/bin:$PATH"
          npm ci
          npm run build

      - name: Install playground dependencies
        working-directory: web/playground
        run: |
          export PATH="$PWD/../../third_party/bin/linux-amd64/nodejs/bin:$PATH"
          npm ci

      - name: Install Playwright browsers
        working-directory: web/playground
        run: |
          export PATH="$PWD/../../third_party/bin/linux-amd64/nodejs/bin:$PATH"
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: web/playground
        run: |
          export PATH="$PWD/../../third_party/bin/linux-amd64/nodejs/bin:$PATH"
          npm run test:e2e:ci

      - name: Run Node smoke test for syntaqlite-js
        working-directory: web/syntaqlite-js
        run: |
          export PATH="$PWD/../../third_party/bin/linux-amd64/nodejs/bin:$PATH"
          npm run test:node

      - name: Install Playwright browser for syntaqlite-js
        working-directory: web/syntaqlite-js
        run: |
          export PATH="$PWD/../../third_party/bin/linux-amd64/nodejs/bin:$PATH"
          npx playwright install chromium

      - name: Run npm package e2e smoke test
        working-directory: web/syntaqlite-js
        run: |
          export PATH="$PWD/../../third_party/bin/linux-amd64/nodejs/bin:$PATH"
          npm run test:package

      - name: Upload npm package test report
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: syntaqlite-js-package-test-report
          path: |
            web/syntaqlite-js/playwright-report/
            web/syntaqlite-js/test-results/
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: web/playground/playwright-report/
          retention-days: 30

  deploy-playwright-report:
    name: Deploy Playwright report
    needs: playwright-tests
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@v7
        with:
          name: playwright-report
          path: playwright-report

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy playwright-report --project-name=syntaqlite-playwright-reports --branch=pr-${{ github.event.number }}

      - name: Comment PR with report URL
        uses: actions/github-script@v8
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const sha = '${{ github.event.pull_request.head.sha }}'.slice(0, 7);
            const status = '${{ needs.playwright-tests.result }}';
            const icon = status === 'success' ? '✅' : '❌';
            const now = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
            const entry = `| ${icon} | \`${sha}\` | ${now} | [report](${url}) |`;
            const header = [
              '### Playwright Reports',
              '',
              '| | commit | time | link |',
              '|---|--------|------|------|',
            ].join('\n');
            const marker = '<!-- playwright-reports -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              const body = existing.body + '\n' + entry;
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              const body = marker + '\n' + header + '\n' + entry;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
