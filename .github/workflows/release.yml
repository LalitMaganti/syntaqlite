# Build all release artifacts and publish.
#
# On version tag push: builds CLI binaries, Python wheels, C libraries, the
# libsyntaqlite-parser source, and publishes to PyPI and GitHub Releases.
# On pull_request: builds Python wheels only (smoke test).
name: Release

permissions:
  contents: write

on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Single Rust build per platform. Produces:
  #   - CLI binary archive (tar.gz/zip)
  #   - Static and shared libsyntaqlite libraries
  #   - buildtools binary (for amalgamation, linux-x64 only)
  build:
    name: build (${{ matrix.name }})
    if: ${{ !github.event.pull_request }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin, binary: syntaqlite, staticlib: libsyntaqlite.a, cdylib: libsyntaqlite.dylib, archive: tar.gz, out: target/release}
          - {name: macos-x64, runner: macos-26-intel, target: x86_64-apple-darwin, binary: syntaqlite, staticlib: libsyntaqlite.a, cdylib: libsyntaqlite.dylib, archive: tar.gz, out: target/release}
          - {name: linux-x64, runner: ubuntu-latest, container: "quay.io/pypa/manylinux_2_28_x86_64", target: x86_64-unknown-linux-gnu, binary: syntaqlite, staticlib: libsyntaqlite.a, cdylib: libsyntaqlite.so, archive: tar.gz, out: target/release}
          - {name: linux-arm64, runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64", target: aarch64-unknown-linux-gnu, binary: syntaqlite, staticlib: libsyntaqlite.a, cdylib: libsyntaqlite.so, archive: tar.gz, out: target/release}
          - {name: windows-x64, runner: windows-latest, target: x86_64-pc-windows-msvc, binary: syntaqlite.exe, staticlib: syntaqlite.lib, cdylib: syntaqlite.dll, importlib: syntaqlite.dll.lib, archive: zip, out: target/release}
          - {name: windows-arm64, runner: windows-latest, target: aarch64-pc-windows-msvc, binary: syntaqlite.exe, staticlib: syntaqlite.lib, cdylib: syntaqlite.dll, importlib: syntaqlite.dll.lib, archive: zip, out: target/aarch64-pc-windows-msvc/release, cross: true}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      SYNTAQLITE_BUILDING: "1"
    steps:
      - uses: actions/checkout@v6

      # manylinux_2_28 ships gcc but no Rust; this pins the binary to glibc 2.28.
      - name: Install Rust (Linux container)
        if: ${{ matrix.container }}
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cross-compilation target
        if: matrix.name == 'windows-arm64'
        run: rustup target add ${{ matrix.target }}

      # -- Build everything in one cargo invocation where possible --
      - name: Build CLI
        if: ${{ !matrix.cross }}
        shell: bash
        run: cargo build --release -p syntaqlite-cli

      - name: Build CLI (cross-compiled)
        if: ${{ matrix.cross }}
        shell: bash
        run: cargo build --release -p syntaqlite-cli --target ${{ matrix.target }}

      - name: Build buildtools
        if: matrix.name == 'linux-x64'
        shell: bash
        run: cargo build --release -p syntaqlite-buildtools

      # Runs first so cargo cannot later replace the specially linked shared library.
      - name: Build C static library
        shell: bash
        run: |
          cargo build --release -p syntaqlite-capi --features dynload \
            ${{ matrix.cross && format('--target {0}', matrix.target) || '' }}

      - name: Build full C shared library
        shell: bash
        run: |
          python3 tools/build-c-library --release \
            ${{ matrix.cross && format('--target {0}', matrix.target) || '' }}

      # Release builds keep the debug info of Rust's standard library. Windows
      # keeps debug info in separate .pdb files, so its libraries need nothing.
      - name: Strip debug info from the C libraries
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ matrix.out }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            strip -S ${{ matrix.staticlib }}
            strip -x ${{ matrix.cdylib }}
          else
            strip --strip-debug ${{ matrix.staticlib }}
            strip --strip-unneeded ${{ matrix.cdylib }}
          fi

      # -- Smoke test CLI --
      - name: Smoke test CLI
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          target/release/${{ matrix.binary }} --version
          echo "select 1" | target/release/${{ matrix.binary }} fmt
          echo "select 1" | target/release/${{ matrix.binary }} analyze

      # -- Package CLI archive --
      - name: Name CLI archive
        shell: bash
        run: echo "CLI_ARCHIVE=syntaqlite-${GITHUB_REF_NAME#v}-${{ matrix.name }}.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - name: Package CLI (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p staging/
          cp target/release/${{ matrix.binary }} staging/
          tar -czf "$CLI_ARCHIVE" -C staging ${{ matrix.binary }}

      - name: Package CLI (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          mkdir -p staging/
          cp "${{ matrix.out }}/${{ matrix.binary }}" staging/
          cd staging && 7z a -tzip "../$CLI_ARCHIVE" "${{ matrix.binary }}"

      # -- Upload all artifacts --
      - name: Upload CLI archive
        uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.name }}
          path: ${{ env.CLI_ARCHIVE }}

      # TODO(#514): stop publishing the old names once Zed users have an
      # extension version that reads the release manifest.
      - name: Copy CLI archive to its old name for the Zed extension
        if: startsWith(matrix.name, 'macos-') || startsWith(matrix.name, 'linux-')
        shell: bash
        run: |
          mkdir -p legacy
          cp "$CLI_ARCHIVE" "legacy/syntaqlite-${{ matrix.name }}.${{ matrix.archive }}"

      - name: Upload CLI archive under its old name
        if: startsWith(matrix.name, 'macos-') || startsWith(matrix.name, 'linux-')
        uses: actions/upload-artifact@v6
        with:
          name: legacy-cli-${{ matrix.name }}
          path: legacy/syntaqlite-${{ matrix.name }}.${{ matrix.archive }}

      - name: Describe CLI archive for the release manifest
        shell: bash
        run: |
          mkdir -p manifest-part
          printf '{"target": "%s", "name": "%s", "binary": "%s"}\n' \
            "${{ matrix.target }}" \
            "$CLI_ARCHIVE" \
            "${{ matrix.binary }}" > "manifest-part/${{ matrix.name }}.json"

      - name: Upload release manifest part
        uses: actions/upload-artifact@v6
        with:
          name: manifest-part-${{ matrix.name }}
          path: manifest-part/${{ matrix.name }}.json

      - name: Upload libsyntaqlite
        uses: actions/upload-artifact@v6
        with:
          name: libsyntaqlite-${{ matrix.name }}
          path: |
            ${{ matrix.out }}/${{ matrix.staticlib }}
            ${{ matrix.out }}/${{ matrix.cdylib }}
            ${{ matrix.importlib && format('{0}/{1}', matrix.out, matrix.importlib) || '' }}

      - name: Upload buildtools
        if: matrix.name == 'linux-x64'
        uses: actions/upload-artifact@v6
        with:
          name: buildtools
          path: target/release/syntaqlite-buildtools

  # Upload CLI archives to GitHub Release.
  upload-release:
    name: Upload to GitHub Release
    needs: build
    if: ${{ !github.event.pull_request }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Download all CLI archives
        uses: actions/download-artifact@v7
        with:
          pattern: cli-*
          path: archives/
          merge-multiple: true

      - name: Download CLI archives under their old names
        uses: actions/download-artifact@v7
        with:
          pattern: legacy-cli-*
          path: archives/
          merge-multiple: true

      - name: Upload to GitHub Release
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — uploading artifacts"
            gh release upload "$TAG" archives/* --clobber
          else
            echo "Release $TAG not found — creating draft"
            gh release create "$TAG" --target "${{ github.sha }}" \
              --draft --title "$TAG" --generate-notes archives/*
          fi

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          SHA_MACOS_ARM64=$(sha256sum archives/syntaqlite-${VERSION}-macos-arm64.tar.gz | cut -d' ' -f1)
          SHA_MACOS_X64=$(sha256sum archives/syntaqlite-${VERSION}-macos-x64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_X64=$(sha256sum archives/syntaqlite-${VERSION}-linux-x64.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(sha256sum archives/syntaqlite-${VERSION}-linux-arm64.tar.gz | cut -d' ' -f1)

          cat > formula.rb << FORMULA
          class Syntaqlite < Formula
            desc "Fast, accurate SQLite SQL formatter, validator, and language server"
            homepage "https://syntaqlite.com"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/LalitMaganti/syntaqlite/releases/download/${TAG}/syntaqlite-${VERSION}-macos-arm64.tar.gz"
                sha256 "${SHA_MACOS_ARM64}"
              else
                url "https://github.com/LalitMaganti/syntaqlite/releases/download/${TAG}/syntaqlite-${VERSION}-macos-x64.tar.gz"
                sha256 "${SHA_MACOS_X64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/LalitMaganti/syntaqlite/releases/download/${TAG}/syntaqlite-${VERSION}-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/LalitMaganti/syntaqlite/releases/download/${TAG}/syntaqlite-${VERSION}-linux-x64.tar.gz"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              bin.install "syntaqlite"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/syntaqlite --version")
            end
          end
          FORMULA

          # Push formula to tap repo
          gh api repos/LalitMaganti/homebrew-tap/contents/Formula/syntaqlite.rb \
            --method PUT \
            --field message="Update syntaqlite to ${VERSION}" \
            --field content="$(base64 -w0 formula.rb)" \
            --field sha="$(gh api repos/LalitMaganti/homebrew-tap/contents/Formula/syntaqlite.rb --jq '.sha')"

  # Build one Python wheel per (OS, arch). The Python package is pure Python
  # but it bundles the platform-specific `syntaqlite` CLI binary, so the wheel
  # is tagged `py3-none-<plat>` — one wheel per OS/arch covers every Py3.
  build-python-wheels:
    name: python-wheels (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, runner: ubuntu-latest, container: "quay.io/pypa/manylinux_2_28_x86_64"}
          - {name: linux-aarch64, runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64"}
          - {name: macos-arm64, runner: macos-latest, macos_deployment: "11.0"}
          - {name: macos-x86_64, runner: macos-26-intel, macos_deployment: "10.12"}
          - {name: windows-amd64, runner: windows-latest}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v6

      # The manylinux image ships its own Pythons under /opt/python/; expose
      # cp312 on PATH. Non-container runners use setup-python below instead.
      - name: Use manylinux Python (Linux container)
        if: ${{ matrix.container }}
        shell: bash
        run: echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v6
        if: ${{ !matrix.container }}
        with:
          python-version: "3.12"

      - name: Install Rust (Linux container)
        if: ${{ matrix.container }}
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build CLI
        shell: bash
        run: cargo build --release -p syntaqlite-cli

      - name: Build cdylib (in-process transport)
        shell: bash
        run: cargo build --release -p syntaqlite-capi --features dynload

      # The release ships the static library built alongside this cdylib, and
      # this job runs on pull requests, so check a C program links against it.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Link a C program against the static library
        shell: bash
        run: python tools/check-static-library

      - name: Build wheel
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment }}
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir wheelhouse/ python/

      # PyPI rejects plain linux_* wheels. auditwheel validates the bundled
      # CLI binary against manylinux_2_28 and emits a correctly-tagged wheel;
      # the build runs inside the matching manylinux container so the glibc
      # symbol requirements line up.
      - name: Repair Linux wheel with auditwheel
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        run: |
          python -m pip install auditwheel
          arch=$(echo "${{ matrix.name }}" | sed 's/^linux-//')
          python -m auditwheel show wheelhouse/*.whl
          python -m auditwheel repair \
            --plat "manylinux_2_28_${arch}" \
            --wheel-dir wheelhouse-repaired/ \
            wheelhouse/*.whl
          rm wheelhouse/*.whl
          mv wheelhouse-repaired/*.whl wheelhouse/

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  # Build the Pyodide (Emscripten/WASM) wheel. Unlike the native wheels, the
  # cdylib is cross-built as an Emscripten side module and loaded via ctypes
  # inside Pyodide. The build needs Pyodide's *patched* emscripten (stock
  # emscripten rejects Rust std's `$`-mangled side-module exports), so we use
  # the emsdk that pyodide-build manages. Rust stays hermetic (third_party).
  build-pyodide-wheel:
    name: python-wheels (pyodide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Cache the cross-build environment + patched emsdk (a large download).
      - name: Cache Pyodide xbuildenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyodide-build
          key: pyodide-xbuildenv-314.0.0

      - name: Install pyodide-build + emsdk
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pyodide-build
          pyodide xbuildenv install 314.0.0
          pyodide xbuildenv install-emscripten

      # Hermetic rust toolchain + pinned wasm32 std (NOT rustup — the std is
      # version-locked to the third_party rustc).
      - name: Install hermetic build deps
        run: tools/install-build-deps --ui

      - name: Build Pyodide wheel
        run: python tools/build-pyodide-wheel --outdir wheelhouse/

      # A wheel can build cleanly and still fail to load — run it for real
      # inside a Pyodide runtime.
      - name: Smoke test in Pyodide
        run: |
          pyodide venv .venv-rt
          .venv-rt/bin/pip install wheelhouse/*.whl
          .venv-rt/bin/python - <<'PY'
          import syntaqlite
          with syntaqlite.Syntaqlite() as sq:
              assert sq.format_sql("select 1") == "SELECT 1;\n"
              assert sq.parse("select * from t")
          print("pyodide smoke test ok")
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheels-pyodide
          path: wheelhouse/*.whl

  # Publish all wheels to PyPI in a single job.
  publish-pypi:
    name: Publish to PyPI
    needs: [build-python-wheels, build-pyodide-wheel]
    if: ${{ !github.event.pull_request }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # Generate the libsyntaqlite-parser C source once, so the source archive and
  # every prebuilt library come from the same files. Runs on pull requests too,
  # so changes that break the prebuilt libraries fail before a release.
  parser-source:
    name: libsyntaqlite-parser source
    runs-on: ubuntu-latest
    env:
      SYNTAQLITE_BUILDING: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Generate libsyntaqlite-parser source
        run: |
          cargo run --release -p syntaqlite-buildtools -- amalgamate-syntax \
            --dialect sqlite \
            --runtime-dir syntaqlite-syntax \
            --dialect-dir syntaqlite-syntax \
            --output-dir parser-out \
            --output-name libsyntaqlite_parser

      - name: Upload libsyntaqlite-parser source
        uses: actions/upload-artifact@v6
        with:
          name: libsyntaqlite-parser-src
          path: parser-out/

  # Compile libsyntaqlite-parser into a static and shared library per platform,
  # and check both link and run.
  parser-libs:
    name: libsyntaqlite-parser (${{ matrix.name }})
    needs: parser-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: macos-arm64, runner: macos-latest, macos_deployment: "11.0"}
          - {name: macos-x64, runner: macos-26-intel, macos_deployment: "10.12"}
          - {name: linux-x64, runner: ubuntu-latest, container: "quay.io/pypa/manylinux_2_28_x86_64"}
          - {name: linux-arm64, runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64"}
          - {name: windows-x64, runner: windows-latest, msvc_arch: x64}
          - {name: windows-arm64, runner: windows-latest, msvc_arch: amd64_arm64, clang_target: aarch64-pc-windows-msvc}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v6

      - name: Use manylinux Python (Linux container)
        if: ${{ matrix.container }}
        shell: bash
        run: echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v6
        if: ${{ !matrix.container }}
        with:
          python-version: "3.12"

      # Only GitHub-owned and verified actions are allowed here, so load the
      # MSVC environment from vcvarsall directly.
      - name: Set up MSVC
        if: ${{ matrix.msvc_arch }}
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" ${{ matrix.msvc_arch }} >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Download libsyntaqlite-parser source
        uses: actions/download-artifact@v7
        with:
          name: libsyntaqlite-parser-src
          path: parser-src/

      # The arm64 Windows build is cross-compiled, so its smoke test is only linked.
      - name: Build libsyntaqlite-parser
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment }}
        run: |
          python tools/build-parser-library \
            --source-dir parser-src \
            --output-dir "parser-lib/${{ matrix.name }}" \
            ${{ matrix.clang_target && format('--target {0} --no-run', matrix.clang_target) || '' }}

      - name: Upload libsyntaqlite-parser libraries
        uses: actions/upload-artifact@v6
        with:
          name: parser-lib-${{ matrix.name }}
          path: parser-lib/

  # Package libsyntaqlite and libsyntaqlite-parser, then upload them to the GH
  # Release with the manifest describing every release file.
  package-c-artifacts:
    name: Package C artifacts
    needs:
      - build
      - upload-release
      - parser-libs
    if: ${{ !github.event.pull_request }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Download buildtools
        uses: actions/download-artifact@v7
        with:
          name: buildtools
          path: bin/

      - name: Make buildtools executable
        run: chmod +x bin/syntaqlite-buildtools

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # -- libsyntaqlite archive --
      - name: Generate amalgamated header
        run: |
          bin/syntaqlite-buildtools amalgamate \
            --syntax-dir syntaqlite-syntax \
            --lib-dir syntaqlite-capi \
            --output staging/syntaqlite.h

      - name: Download all platform libraries
        uses: actions/download-artifact@v7
        with:
          pattern: libsyntaqlite-*
          path: libs/

      - name: Assemble libsyntaqlite archive
        run: |
          for dir in libs/libsyntaqlite-*; do
            platform=$(basename "$dir" | sed 's/^libsyntaqlite-//')
            mkdir -p "staging/$platform"
            cp "$dir"/* "staging/$platform/"
          done
          tar -czf "libsyntaqlite-$VERSION.tar.gz" -C staging .

      # -- libsyntaqlite-parser archives --
      - name: Download libsyntaqlite-parser source
        uses: actions/download-artifact@v7
        with:
          name: libsyntaqlite-parser-src
          path: parser-src/

      - name: Download libsyntaqlite-parser libraries
        uses: actions/download-artifact@v7
        with:
          pattern: parser-lib-*
          path: parser-lib/
          merge-multiple: true

      - name: Assemble libsyntaqlite-parser archives
        run: |
          tar -czf "libsyntaqlite-parser-$VERSION-src.tar.gz" \
            -C parser-src libsyntaqlite_parser.h libsyntaqlite_parser.c
          cp parser-src/libsyntaqlite_parser.h parser-lib/
          tar -czf "libsyntaqlite-parser-$VERSION.tar.gz" -C parser-lib .

      # -- Release manifest --
      - name: Download all CLI archives
        uses: actions/download-artifact@v7
        with:
          pattern: cli-*
          path: archives/
          merge-multiple: true

      - name: Download release manifest parts
        uses: actions/download-artifact@v7
        with:
          pattern: manifest-part-*
          path: manifest-parts/
          merge-multiple: true

      - name: Write release manifest and Downloads table
        run: |
          gh release view "${{ github.ref_name }}" --json body --jq .body > release-notes.md
          # TODO(#514): drop the note once the old names stop being published.
          tools/write-release-manifest \
            --version "$VERSION" \
            --parts manifest-parts \
            --cli-dir archives \
            --file libsyntaqlite="libsyntaqlite-$VERSION.tar.gz" \
            --file libsyntaqlite-parser="libsyntaqlite-parser-$VERSION.tar.gz" \
            --file libsyntaqlite-parser-src="libsyntaqlite-parser-$VERSION-src.tar.gz" \
            --output syntaqlite-release.json \
            --release-notes release-notes.md \
            --repo "${{ github.repository }}" \
            --note "The macOS and Linux CLI archives are also published under their old names, such as \`syntaqlite-linux-x64.tar.gz\`, for older versions of the Zed extension. These copies will stop being published; see #514."
          cat syntaqlite-release.json

      # -- Upload to GH Release --
      # The manifest and Downloads table go last so they only appear once
      # the files they list exist.
      - name: Upload to GitHub Release
        run: |
          gh release upload "${{ github.ref_name }}" \
            "libsyntaqlite-$VERSION.tar.gz" \
            "libsyntaqlite-parser-$VERSION.tar.gz" \
            "libsyntaqlite-parser-$VERSION-src.tar.gz" \
            --clobber
          gh release upload "${{ github.ref_name }}" syntaqlite-release.json --clobber
          gh release edit "${{ github.ref_name }}" --notes-file release-notes.md
