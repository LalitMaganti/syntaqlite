# Publish syntaqlite to npm on release tags.
#
# Uses npm trusted publishing (OIDC) — no NPM_TOKEN needed.
# Configure at https://www.npmjs.com/package/syntaqlite/access
# with: Owner: LalitMaganti, Repo: syntaqlite, Workflow: publish-npm.yml
#
# NOTE: Initial publish requires a token. After first publish,
# configure trusted publishing and remove the token.
name: Publish npm

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - name: Cache third_party
        uses: actions/cache@v5
        with:
          path: third_party
          key: third-party-ui-rust-${{ runner.os }}-${{ hashFiles('python/tools/install_build_deps.py') }}

      - name: Install build dependencies (Rust + Node.js + Emscripten)
        run: python3 tools/install-build-deps --ui

      - name: Build WASM runtime
        run: python3 tools/build-web-playground --hermetic

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: web/syntaqlite-js
        run: npm ci

      - name: Build
        working-directory: web/syntaqlite-js
        run: npm run build

      - name: Verify wasm files are in tarball
        working-directory: web/syntaqlite-js
        run: node scripts/verify-tarball.mjs

      - name: Publish
        working-directory: web/syntaqlite-js
        run: npm publish --access public
