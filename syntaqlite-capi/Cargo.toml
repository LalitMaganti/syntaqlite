[package]
name = "syntaqlite-capi"
version = "0.13.5"
edition = "2024"
description = "C API for syntaqlite (libsyntaqlite)"
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[package.metadata.dist]
dist = false

[lib]
name = "syntaqlite"
crate-type = ["staticlib", "cdylib"]
doc = false

[features]
default = ["sqlite"]
sqlite = ["syntaqlite/sqlite"]
dynload = ["syntaqlite/dynload"]

[lints]
workspace = true

[dependencies]
syntaqlite = { version = "0.13.5", path = "../syntaqlite", default-features = false, features = ["fmt", "analysis", "rpc"] }
