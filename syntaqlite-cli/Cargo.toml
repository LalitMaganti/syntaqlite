[package]
name = "syntaqlite-cli"
version = "0.13.5"
edition = "2024"
repository.workspace = true
description = "Fast CLI and language server for parsing, formatting, and statically analyzing SQLite SQL"
homepage.workspace = true
license = "Apache-2.0"
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "syntaqlite"
path = "src/main.rs"
doc = false
required-features = ["bundled-sqlite-dialect"]

[[example]]
name = "cli_wrapper"
path = "examples/cli_wrapper.rs"
required-features = ["bundled-sqlite-dialect"]

[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/syntaqlite-linux-x64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/syntaqlite-linux-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/syntaqlite-macos-x64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/syntaqlite-macos-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/syntaqlite-windows-x64.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/syntaqlite-windows-arm64.zip"
pkg-fmt = "zip"

[features]
default = ["bundled-sqlite-dialect", "dynload", "codegen", "mcp"]
# Bake in the SQLite dialect and ship the default `syntaqlite` binary.
bundled-sqlite-dialect = ["syntaqlite/sqlite"]
# Expose `--dialect` / `--dialect-name` flags for loading dialects from shared libraries.
dynload = ["syntaqlite/dynload"]
# Expose `dialect` / dialect-tool subcommands for generating dialect sources.
codegen = ["dep:syntaqlite-buildtools"]
# Expose the `mcp` (Model Context Protocol) subcommand.
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
indexmap = { version = "2", features = ["serde"] }
toml = "0.8"
rmcp = { version = "0.1", features = ["server", "transport-io"], optional = true }
schemars = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntaqlite = { version = "0.13.5", path = "../syntaqlite", default-features = false, features = ["fmt", "lsp", "analysis", "experimental-embedded", "serde-json", "rpc"] }
syntaqlite-syntax = { version = "0.13.5", path = "../syntaqlite-syntax" }
syntaqlite-buildtools = { version = "0.13.5", path = "../syntaqlite-buildtools", optional = true }
tempfile = "3.8"
tokio = { version = "1", features = ["rt", "macros", "io-std"], optional = true }
