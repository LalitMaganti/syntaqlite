[package]
name = "syntaqlite-cli"
version = "0.5.0"
edition = "2024"
repository.workspace = true
description = "Fast, accurate SQLite SQL formatter, validator, and language server — built on SQLite's own grammar"
homepage.workspace = true
license = "Apache-2.0"
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "syntaqlite"
path = "src/main.rs"
doc = false
required-features = ["bundled-sqlite-dialect"]

[[example]]
name = "cli_wrapper"
path = "examples/cli_wrapper.rs"
required-features = ["bundled-sqlite-dialect"]

[features]
default = ["bundled-sqlite-dialect", "dynload", "codegen", "mcp"]
# Bake in the SQLite dialect and ship the default `syntaqlite` binary.
bundled-sqlite-dialect = ["syntaqlite/sqlite"]
# Expose `--dialect` / `--dialect-name` flags for loading dialects from shared libraries.
dynload = ["syntaqlite/dynload"]
# Expose `dialect` / dialect-tool subcommands for generating dialect sources.
codegen = ["dep:syntaqlite-buildtools"]
# Expose the `mcp` (Model Context Protocol) subcommand.
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
indexmap = { version = "2", features = ["serde"] }
toml = "0.8"
rmcp = { version = "0.1", features = ["server", "transport-io"], optional = true }
schemars = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntaqlite = { version = "0.5.0", path = "../syntaqlite", default-features = false, features = ["fmt", "lsp", "analysis", "experimental-embedded", "serde-json"] }
syntaqlite-syntax = { version = "0.5.0", path = "../syntaqlite-syntax" }
syntaqlite-buildtools = { version = "0.5.0", path = "../syntaqlite-buildtools", optional = true }
tempfile = "3.8"
tokio = { version = "1", features = ["rt", "macros", "io-std"], optional = true }
